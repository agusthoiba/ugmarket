<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- You can link to your CSS framework or custom styles here -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.0/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/style-admin.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <img src="/image/logo-ugmarket.jpg" width="100" height="auto">
        </div>
        <div class="auth-title">Admin Login</div>
        <div class="auth-body">
            <% if (error)  { %>
            <div class="alert alert-danger" role="alert">
                <%= error %>
            </div>
            <% } %>
            <form class="auth-form" method="post" action="/admin/auth/login">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required autofocus>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>

                <button type="submit">Sign In</button>
            </form>
        </div>
        <div class="auth-footer">
            &copy; 2025 Merchandise Undergroundsync Admin
        </div>
    </div>
</body>
</html>
